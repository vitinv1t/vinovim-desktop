<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradiente principal: roxo escuro → roxo claro → rosa -->
    <linearGradient id="gOuter" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Gradiente para a camada interior (mais escuro/saturado) -->
    <linearGradient id="gRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06B6D4"/>
      <stop offset="40%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <!-- Gloss: brilho especular topo -->
    <linearGradient id="gGloss" x1="20%" y1="0%" x2="80%" y2="50%">
      <stop offset="0%"  stop-color="white" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Sombra roxa externa -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#7C3AED" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feOffset dx="0" dy="3" result="shifted"/>
      <feMerge>
        <feMergeNode in="shifted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sombra play arrow -->
    <filter id="playShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1"/>
      <feFlood flood-color="#1a0040" flood-opacity="0.5"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  
  <g filter="url(#outerGlow)">
    <!-- Camada outer: gradiente ciano→roxo→rosa -->
    <path d="M 15,12 C 10,12 7,16 7,21 L 7,79 C 7,84 10,88 15,88 C 19,88 23,86 26,83 L 86,54 C 91,51 91,49 86,46 L 26,17 C 23,14 19,12 15,12 Z" fill="url(#gRing)"/>
    <!-- Gloss topo -->
    <path d="M 15,12 C 10,12 7,16 7,21 L 7,50 L 86,50 L 86,46 L 26,17 C 23,14 19,12 15,12 Z" fill="url(#gGloss)"/>
    <!-- Recesso escuro interior -->
    <path d="M 20,22 C 17,22 15,24 15,27 L 15,73 C 15,76 17,78 20,78 C 22,78 24,77 26,75 L 72,54 C 75,52 75,48 72,46 L 26,25 C 24,23 22,22 20,22 Z" fill="#0D0916" opacity="0.88"/>
    <!-- Gradiente sutil no recesso -->
    <path d="M 20,22 C 17,22 15,24 15,27 L 15,73 C 15,76 17,78 20,78 C 22,78 24,77 26,75 L 72,54 C 75,52 75,48 72,46 L 26,25 C 24,23 22,22 20,22 Z" fill="url(#gOuter)" opacity="0.08"/>
  </g>
  <!-- Play arrow branco -->
  <polygon points="32,39 61,50 32,61" fill="white" opacity="0.97" filter="url(#playShadow)"/>
</svg>